name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install cdpr + dev + viz + data + api extras
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # --prefer-binary keeps pip from compiling scipy / matplotlib
          # from source on the Ubuntu runner (which can OOM on the free
          # GH Actions worker). Torch / SB3 / MuJoCo extras are skipped
          # here --- the smoke scripts on the dev machine exercise them.
          python -m pip install --prefer-binary -e ".[dev,viz,data,api]"

      - name: Diagnostics — installed packages + cdpr import path
        run: |
          python -m pip list
          python -c "import cdpr, cdpr.dynamics.simulator, cdpr.cables, cdpr.interface.api; print('cdpr at', cdpr.__file__)"

      - name: Lint (ruff)
        run: ruff check src tests
        continue-on-error: true   # not a gate; Phase-8 cleanup pending

      - name: Run pytest (verbose so failures appear in the log)
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest tests/ -v --tb=short --maxfail=10 \
            --ignore=tests/test_learn_env.py \
            --ignore=tests/test_learn_supervised.py \
            --ignore=tests/test_learn_benchmark.py \
            --ignore=tests/test_learn_rl_factories.py \
            --ignore=tests/test_adapters_mujoco.py
        # ^ skip extras-only tests in CI to keep the matrix lean; the
        #   developer environment runs the full 195-test suite locally.
