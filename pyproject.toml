[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cdpr"
version = "0.1.0.dev0"
description = "Hybrid physics-driven and data-driven computational framework for Cable-Driven Parallel Robots."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "M. J. Tachia (Joseph Mfeuter)" }]
keywords = ["cable-driven parallel robot", "cdpr", "robotics", "tension distribution", "workspace", "physics-informed neural networks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "sympy>=1.12",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
  "pillow>=10.0",                       # GIF export
]
viz-extras = [                          # optional richer 3D / web visualisation
  "plotly>=5.18",
  "pyvista>=0.43",
]
learn = [
  "torch>=2.2",
  "gymnasium>=0.29",
]
rl = [
  "cdpr[learn]",
  "stable-baselines3>=2.3",
]
data = [
  "pandas>=2.1",
  "openpyxl>=3.1",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]
gui = [
  "streamlit>=1.32",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  "httpx>=0.27",                         # FastAPI TestClient
]
adapters-mujoco = ["mujoco>=3.1"]
adapters-pybullet = ["pybullet>=3.2"]
all = [
  "cdpr[viz,viz-extras,learn,rl,data,api,gui,dev]",
]

[project.urls]
Homepage = "https://github.com/mfeuter/cdpr"
Repository = "https://github.com/mfeuter/cdpr"
Issues = "https://github.com/mfeuter/cdpr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cdpr"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
  "slow: marks tests that exercise full dynamic integration",
  "numerical: marks tests sensitive to floating-point tolerances",
]

[tool.coverage.run]
source = ["cdpr"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pyflakes / pycodestyle
  "I",               # isort
  "N",               # pep8-naming
  "UP",              # pyupgrade
  "B",               # bugbear
  "SIM",             # simplify
  "NPY",             # numpy-specific
  "RUF",             # ruff-specific
]
ignore = [
  "E741",  # ambiguous names (l, I, O) — common in robotics math
  "N803",  # argument name doesn't match snake_case (we use single capitals for matrices)
  "N806",  # variable in function should be lowercase (M, J, R, T are conventional)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "sympy.*", "pyvista.*", "plotly.*"]
ignore_missing_imports = true
